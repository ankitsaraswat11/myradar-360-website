<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MyRadar 360 — See beyond the noise. Understand the signals.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MyRadar 360 brings news, social platforms and online conversation into one clear view — with sentiment, trends and real-time alerts for your team.">
  <meta name="theme-color" content="#070c15">
  <script>
    /* Apply the saved (or system) theme before first paint so there is no light/dark flash.
       Key must match THEME_KEY in src/app/core/theme.service.ts. */
    (function () {
      var t = 'dark';
      try {
        var s = localStorage.getItem('myradar-theme');
        if (s === 'light' || s === 'dark') t = s;
        else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
      } catch (e) {}
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      r.style.colorScheme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#070c15' : '#f4f7fa');
    })();
  </script>
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MyRadar 360">
  <meta property="og:title" content="MyRadar 360 — See beyond the noise. Understand the signals.">
  <meta property="og:description" content="Social and media intelligence: monitoring, sentiment, trends and real-time alerts in one clear view.">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <app-root></app-root>
  <noscript>MyRadar 360 — a social and media intelligence platform. Please enable JavaScript to view this website.</noscript>
</body>
</html>
